# GRPO base config for Geometry3K on Nemotron-Nano-12B-v2-VL (LoRA).
#
# Designed to warm-start from our SFT LoRA checkpoint under
# /ephemeral/vuvlm/nemo-RL-v0.5.0/results/sft_lora/step_*. The exact step and
# the load mechanism (merged-HF-dir vs keep-LoRA-apply-adapter) are a TODO
# left to the user — see `policy.model_name` below.
#
# Reward set is registered per-env but not enabled here (this base file
# configures the training loop + model; reward_functions should be
# overridden by the downstream config — see grpo_geometry3k_judge.yaml).

grpo:
  num_prompts_per_step: 4
  num_generations_per_prompt: 4
  max_rollout_turns: 1
  max_num_epochs: 1
  max_num_steps: 100
  normalize_rewards: true
  use_leave_one_out_baseline: true
  val_period: 10
  val_at_start: false
  overlong_filtering: false
  max_val_samples: 16
  val_batch_size: 16
  seed: 42
  use_dynamic_sampling: false
  batch_multiplier: 1
  reward_shaping:
    enabled: false
    overlong_buffer_length: 512
    overlong_buffer_penalty: 1
    max_response_length: ${policy.max_total_sequence_length}
  reward_scaling:
    enabled: false
    source_min: 0.0
    source_max: 1.0
    target_min: 0.0
    target_max: 1.0
  async_grpo:
    enabled: false
    max_trajectory_age_steps: 1

loss_fn:
  reference_policy_kl_penalty: 0.01
  reference_policy_kl_type: "k3"
  kl_input_clamp_value: 20.0
  kl_output_clamp_value: 10.0
  ratio_clip_min: 0.2
  ratio_clip_max: 0.2
  ratio_clip_c: null
  use_on_policy_kl_approximation: false
  use_importance_sampling_correction: false
  truncated_importance_sampling_ratio: null
  token_level_loss: true
  force_on_policy_ratio: false

checkpointing:
  enabled: true
  checkpoint_dir: "results/grpo_geometry3k"
  metric_name: "val:accuracy"
  higher_is_better: true
  keep_top_k: 3
  save_period: 10
  checkpoint_must_save_by: null
  save_consolidated: true

policy:
  # Warm-start plan (user decision: LoRA-apply, keep training the adapter):
  # load the base VL model from HF and apply our SFT LoRA adapter on top,
  # then GRPO keeps training the adapter. The adapter is at
  #   /ephemeral/vuvlm/nemo-RL-v0.5.0/results/sft_lora/step_<N>/policy/weights/model
  # (contains adapter_model.safetensors + adapter_config.json).
  #
  # TODO(warm-start wiring): dtensor_policy_worker_v2.py currently calls
  # apply_lora_to_linear_modules() which INITIALIZES a fresh LoRA via
  # xavier/zeros — it does NOT read our SFT adapter weights. Until a hook
  # is added (either a new `policy.lora_ckpt_path` config field handled
  # post-apply_lora, or a one-time copy of the SFT adapter state_dict into
  # GRPO's checkpoint_dir so the resume path loads it), starting GRPO will
  # produce a cold adapter despite the matching lora_cfg below. Pick a
  # specific `sft_lora/step_<N>/` when the loading mechanism lands.
  model_name: "nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-BF16"
  tokenizer:
    name: ${policy.model_name}
    chat_template: "default"
    chat_template_kwargs: null
  train_global_batch_size: 16
  train_micro_batch_size: 1
  generation_batch_size: 16
  logprob_batch_size: 1
  max_total_sequence_length: 6144
  precision: "bfloat16"
  offload_optimizer_for_logprob: false

  dtensor_cfg:
    _v2: true
    enabled: true
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: true
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null

    # Vision activation checkpointing — matches our SFT config. Values below
    # become env vars the dtensor_v2 worker reads (lm_policy → env_vars).
    env_vars:
      NRL_VISION_AC: "1"
      NRL_VISION_AC_UNIT: "4"

    lora_cfg:
      enabled: true
      match_all_linear: true
      dim: 8
      alpha: 32
      dropout: 0.0
      dropout_position: "post"
      lora_A_init: "xavier"
      use_triton: true

  megatron_cfg:
    enabled: false

  dynamic_batching:
    enabled: true
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64

  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}
  max_grad_norm: 1.0

  sequence_packing:
    enabled: false

  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 5e-7
      weight_decay: 0.01
      betas: [0.9, 0.999]
      eps: 1e-8
      foreach: False
      fused: False

  scheduler:
    - name: "torch.optim.lr_scheduler.LinearLR"
      kwargs:
        start_factor: 0.1
        end_factor: 1.0
        total_iters: 50
    - name: "torch.optim.lr_scheduler.ConstantLR"
      kwargs:
        factor: 1.0
        total_iters: 10000000000
    - milestones: [50]

  generation:
    backend: "vllm"
    max_new_tokens: 1024
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: false
      precision: ${policy.precision}
      kv_cache_dtype: "auto"
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      gpu_memory_utilization: 0.6
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: False
      skip_tokenizer_init: False
    colocated:
      enabled: true
      resources:
        gpus_per_node: null
        num_nodes: null

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  prompt_file: null
  system_prompt_file: null
  dataset_name: "geometry3k"
  env_name: "geometry3k"
  split: "train"
  shuffle: true
  num_workers: 1

env:
  geometry3k:
    # With num_prompts_per_step=4 and num_generations_per_prompt=4 (=16 rollouts),
    # chunk_list_to_workers splits 16 rollouts across 4 workers as 4 each — and
    # because rollouts are ordered [prompt_0 × 4 gens, prompt_1 × 4 gens, ...],
    # each worker sees exactly one prompt's full GRPO group. Keep num_workers
    # <= num_prompts_per_step (so a worker never splits a group) when tuning.
    num_workers: 4
    # Default reward set — kept minimal in the base config. Downstream
    # configs (e.g. grpo_geometry3k_judge.yaml) override this with the
    # SVG-aux reward mix.
    reward_functions:
      - name: svg_format
        weight: 1.0

logger:
  log_dir: "logs"
  num_val_samples_to_print: 0
  wandb_enabled: false
  tensorboard_enabled: true
  swanlab_enabled: false
  mlflow_enabled: false
  monitor_gpus: true
  wandb:
    project: "render-reward"
    name: "grpo-geometry3k"
  tensorboard: {}
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 8
  num_nodes: 1
